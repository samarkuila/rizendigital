<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Echo AI agent">
<defs>
<style>
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.prop{animation:bob 3.6s ease-in-out infinite}
.ant{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.eyes,.prop,.ant{animation:none}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36a3ff"/><stop offset="1" stop-color="#0b1030"/></linearGradient>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".08" stop-color="#36a3ff"/><stop offset="1" stop-color="#1c6fe0"/></linearGradient>
<linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36a3ff"/><stop offset="1" stop-color="#1c6fe0"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#9bf0ff" stop-opacity=".45"/><stop offset="1" stop-color="#9bf0ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<rect width="400" height="400" fill="url(#grid)"/>
<circle cx="200" cy="170" r="190" fill="url(#halo)"/>
<circle cx="70" cy="60" r="90" fill="#9bf0ff" opacity=".08"/><circle cx="350" cy="380" r="120" fill="#1c6fe0" opacity=".35"/>
<circle cx="52" cy="90" r="3" fill="#fff" opacity="0.5"/><circle cx="70" cy="300" r="2.5" fill="#fff" opacity="0.4"/><circle cx="352" cy="260" r="3.5" fill="#fff" opacity="0.35"/><circle cx="40" cy="210" r="2" fill="#fff" opacity="0.5"/><circle cx="340" cy="340" r="2.5" fill="#fff" opacity="0.3"/><circle cx="110" cy="40" r="2" fill="#fff" opacity="0.45"/>
<g>
<path d="M62 400 C62 318 118 292 200 292 C282 292 338 318 338 400Z" fill="url(#bodyg)"/>
<path d="M62 400 C62 318 118 292 200 292 C282 292 338 318 338 400Z" fill="url(#gloss)"/>
<path d="M150 296 Q200 330 250 296" stroke="#0b1030" stroke-opacity=".35" stroke-width="10" fill="none" stroke-linecap="round"/>
<rect x="172" y="268" width="56" height="34" rx="14" fill="#1a2260"/>
<rect x="150" y="312" width="100" height="44" rx="16" fill="#0b1030" opacity=".85"/>
<circle cx="200" cy="332" r="13" fill="#9bf0ff" opacity=".95" filter="url(#glow)"/><circle cx="200" cy="332" r="5" fill="#0b1030"/>
<rect x="164" y="346" width="72" height="5" rx="2.5" fill="#9bf0ff" opacity=".55"/>
</g>
<g class="ant"></g>
<rect x="90" y="150" width="26" height="60" rx="13" fill="#1a2260"/><rect x="284" y="150" width="26" height="60" rx="13" fill="#1a2260"/><path d="M100 150 Q100 80 200 80 Q300 80 300 150" stroke="#1a2260" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M300 200 Q300 240 262 246" stroke="#1a2260" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="256" cy="246" r="9" fill="#9bf0ff" filter="url(#glow)"/>
<rect x="108" y="92" width="184" height="164" rx="70" fill="url(#hg)"/>
<path d="M120 112 Q150 96 190 96" stroke="#fff" stroke-opacity=".55" stroke-width="6" fill="none" stroke-linecap="round"/>
<rect x="134" y="140" width="132" height="86" rx="34" fill="#0b1030"/><rect x="134" y="140" width="132" height="86" rx="34" fill="url(#gloss)"/><g class="eyes"><circle cx="172" cy="178" r="13" filter="url(#glow)" fill="#9bf0ff"/><circle cx="228" cy="178" r="13" filter="url(#glow)" fill="#9bf0ff"/><circle cx="176" cy="173" r="4" fill="#fff"/><circle cx="232" cy="173" r="4" fill="#fff"/><path d="M184 203 Q200 216 216 203" stroke="#9bf0ff" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/></g>
<circle cx="126" cy="214" r="7" fill="#9bf0ff" opacity=".35"/><circle cx="274" cy="214" r="7" fill="#9bf0ff" opacity=".35"/>
