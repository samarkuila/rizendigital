<path d="M120 112 Q150 96 190 96" stroke="#fff" stroke-opacity=".55" stroke-width="6" fill="none" stroke-linecap="round"/>
<rect x="134" y="140" width="132" height="86" rx="34" fill="#0b1030"/><rect x="134" y="140" width="132" height="86" rx="34" fill="url(#gloss)"/><g class="eyes"><path d="M156 188 Q172 165 188 188" stroke="#ffd166" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)"/><path d="M212 188 Q228 165 244 188" stroke="#ffd166" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)"/><path d="M180 204 Q200 222 220 204" stroke="#ffd166" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/></g>
