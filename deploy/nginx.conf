# /etc/nginx/sites-available/rizendigital  (certbot adds the HTTPS block for you)
server {
    listen 80;
    listen [::]:80;
    server_name rizendigital.com www.rizendigital.com;

    add_header Strict-Transport-Security "max-age=31536000" always;   # also covers the apex redirect (no Django HSTS there)

    client_max_body_size 20M;   # admin image uploads

    location /static/ {
        alias /srv/rizendigital/staticfiles/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/rizendigital/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_hide_header Strict-Transport-Security;   # nginx sets it once, above
        proxy_pass http://unix:/run/rizendigital/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml font/ttf;

    # certbot adds the 443 block; after it runs, add `http2 on;` inside that server block.
}
