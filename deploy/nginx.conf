# /etc/nginx/sites-available/rizendigital  (certbot adds the HTTPS block for you)
server {
    listen 80;
    listen [::]:80;
    server_name rizendigital.com www.rizendigital.com;

    client_max_body_size 20M;   # admin image uploads

    location /static/ {
        alias /srv/rizendigital/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/rizendigital/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/rizendigital.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
